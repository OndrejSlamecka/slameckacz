name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Own concurrency group (not the shared "pages" group) so a stuck
# legacy pages-build-deployment run cannot block these deploys.
concurrency:
  group: pages-actions-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The built, ready-to-serve site already lives on the gh-pages branch.
      - name: Check out built site (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Drop VCS metadata before publishing
        run: rm -rf .git

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
